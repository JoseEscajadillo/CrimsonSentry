name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Compile check only; real builds go through `stellar contract build`,
      # which also sets this flag after shaking the contract spec.
      - run: cargo build --target wasm32v1-none --release
        env:
          SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2: "1"

  # cargo scout-audit (CoinFabrik). The official action cannot build
  # soroban-sdk 28, so scout runs through scripts/scout.sh (see its header).
  scout-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-dylint dylint-link cargo-scout-audit
      - run: bash scripts/scout.sh
      - name: report
        if: always()
        run: cat docs/scout-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scout-report
          path: docs/scout-report.md
          if-no-files-found: ignore
